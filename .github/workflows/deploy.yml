name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

env:
  BACKEND_DIR: okjt-app/backend
  FRONTEND_DIR: okjt-app/frontend

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, fileinfo, intl, json, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies (with dev)
        working-directory: ${{ env.BACKEND_DIR }}
        run: composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Fix backend styling with Pint
        working-directory: ${{ env.BACKEND_DIR }}
        run: ./vendor/bin/pint

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Fix frontend styling with ESLint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint -- --fix || npx eslint --fix .
        continue-on-error: true

      - name: Verify frontend build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Commit automatic fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: Apply automatic formatting fixes [skip ci]"

  test-backend:
    needs: lint-and-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, fileinfo, intl, json, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    env:
      REMOTE_USER: zhpebukm
      REMOTE_HOST: 51.89.113.223
      REMOTE_PORT: 1624
      BACKEND_TARGET: /home/zhpebukm/okj-core
      PUBLIC_TARGET: /home/zhpebukm/public_html/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, fileinfo, intl, json, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Write backend .env
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > .env
          if ! grep -qE '^APP_KEY=base64:' .env; then
            php artisan key:generate --force
          fi

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || env.REMOTE_PORT }} -H ${{ secrets.SSH_HOST || env.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Package backend for deployment
        run: |
          tar czf backend.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='./storage/logs' \
            --exclude='./storage/framework/cache' \
            --exclude='./storage/framework/sessions' \
            --exclude='./storage/framework/views' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            -C ${{ env.BACKEND_DIR }} .

      - name: Deploy backend files
        run: |
          scp -P ${{ secrets.SSH_PORT || env.REMOTE_PORT }} backend.tar.gz ${{ secrets.SSH_USER || env.REMOTE_USER }}@${{ secrets.SSH_HOST || env.REMOTE_HOST }}:/home/zhpebukm/backend.tar.gz
          ssh -p ${{ secrets.SSH_PORT || env.REMOTE_PORT }} ${{ secrets.SSH_USER || env.REMOTE_USER }}@${{ secrets.SSH_HOST || env.REMOTE_HOST }} "cd /home/zhpebukm && mkdir -p backend_new && tar xzf backend.tar.gz -C backend_new && cp -a ${{ env.BACKEND_TARGET }}/storage backend_new/ 2>/dev/null || true && cp ${{ env.BACKEND_TARGET }}/.env backend_new/ 2>/dev/null || true && rm -rf ${{ env.BACKEND_TARGET }} && mv backend_new ${{ env.BACKEND_TARGET }} && rm backend.tar.gz"

      - name: Deploy backend .env
        run: |
          scp -P ${{ secrets.SSH_PORT || env.REMOTE_PORT }} \
            ${{ env.BACKEND_DIR }}/.env \
            ${{ secrets.SSH_USER || env.REMOTE_USER }}@${{ secrets.SSH_HOST || env.REMOTE_HOST }}:${{ env.BACKEND_TARGET }}/.env

      - name: Deploy public API entry point
        run: |
          tar czf public.tar.gz -C ${{ env.BACKEND_DIR }}/public .
          scp -P ${{ secrets.SSH_PORT || env.REMOTE_PORT }} public.tar.gz ${{ secrets.SSH_USER || env.REMOTE_USER }}@${{ secrets.SSH_HOST || env.REMOTE_HOST }}:/home/zhpebukm/public.tar.gz
          ssh -p ${{ secrets.SSH_PORT || env.REMOTE_PORT }} ${{ secrets.SSH_USER || env.REMOTE_USER }}@${{ secrets.SSH_HOST || env.REMOTE_HOST }} "rm -rf ${{ env.PUBLIC_TARGET }} && mkdir -p ${{ env.PUBLIC_TARGET }} && tar xzf /home/zhpebukm/public.tar.gz -C ${{ env.PUBLIC_TARGET }} && rm /home/zhpebukm/public.tar.gz"

      - name: Activate backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || env.REMOTE_HOST }}
          username: ${{ secrets.SSH_USER || env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || env.REMOTE_PORT }}
          script_stop: true
          script: |
            cd ${{ env.BACKEND_TARGET }}
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app/public
            if command -v composer &> /dev/null; then composer install --no-dev --optimize-autoloader --no-interaction; fi
            find vendor -type d -exec chmod 755 {} +
            find vendor -type f -exec chmod 644 {} +
            chmod -R 775 storage bootstrap/cache
            chmod 600 .env
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            ls -la ${{ env.PUBLIC_TARGET }}/index.php
