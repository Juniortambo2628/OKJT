name: Packages release

# Push a tag such as v0.1.0 (on a commit that has the packages) to:
#   1. publish every npm package in packages/ whose version is not on npm yet;
#   2. copy packages/laravel-kit to its own repository and tag it there, which
#      is where Composer installs okjt/laravel-kit from.
#
# npm: the first release of each package needs the NPM_TOKEN secret (a
# granular token that can publish to the okjt organisation). Once each
# package exists, set this workflow as its Trusted Publisher on npmjs.com and
# remove the secret: npm then needs no token at all.
#
# Composer: needs the empty repository Juniortambo2628/okjt-laravel-kit and the
# SPLIT_TOKEN secret (a fine-grained GitHub token with Contents: read and
# write on that repository only).
#
# To release the Composer package again for an existing tag (say the copy
# failed), run this workflow from the Actions tab with that tag: npm skips
# versions it already has.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or later).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test

      - name: Publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in $(node -p "require('./package.json').workspaces.join(' ')"); do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish --workspace "$dir" --provenance --access public
            fi
          done

  composer:
    name: Release okjt/laravel-kit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          # Otherwise git keeps sending this run's own token, which may not
          # write to another repository, instead of SPLIT_TOKEN.
          persist-credentials: false

      - name: Copy packages/laravel-kit to its own repository, and tag it
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$SPLIT_TOKEN" ]; then echo "::error::The SPLIT_TOKEN secret is not set"; exit 1; fi
          git subtree split --prefix packages/laravel-kit -b laravel-kit-split
          remote="https://x-access-token:${SPLIT_TOKEN}@github.com/Juniortambo2628/okjt-laravel-kit.git"
          git push "$remote" laravel-kit-split:main --force
          git push "$remote" "laravel-kit-split:refs/tags/${TAG}"
