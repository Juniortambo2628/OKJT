name: Packages CI

on:
  pull_request:
    paths: ['packages/**', '.github/workflows/packages-*.yml']
  workflow_dispatch:

concurrency:
  group: packages-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Packages (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm test
